# Dev database for ProCare (spec-001). Usage: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: procare-db
    environment:
      POSTGRES_USER: procare
      POSTGRES_PASSWORD: procare
      POSTGRES_DB: procare
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procare -d procare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
